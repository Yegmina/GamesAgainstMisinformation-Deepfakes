name: staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deepdetect-staging
  cancel-in-progress: true

jobs:
  deploy_and_test:
    runs-on: [self-hosted, linux, x64, deepdetect]
    environment: serverenv
    defaults:
      run:
        working-directory: repo/DeepDetectGamePlatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: repo

      - name: Ensure Docker is ready
        run: docker info >/dev/null

      - name: Deploy staging environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: openai
          RUNTIME_BASE_DIR: /home/dev/actions-runner-deepdetect/_runtime
          COMMIT_SHA: ${{ github.sha }}
        run: ./scripts/deploy_env.sh staging docker-compose.staging.yml 0

      - name: Wait for local health
        run: ./scripts/wait_for_health.sh http://127.0.0.1:8104 300

      - name: Run local API smoke test suite
        env:
          DEEPDETECT_URL: http://127.0.0.1:8104
        run: python3 scripts/smoke_deployment.py

      - name: Verify public health endpoint
        run: ./scripts/wait_for_health.sh http://76.13.159.31:8104 120
